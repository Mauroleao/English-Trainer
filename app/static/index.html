<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Trainer</title>
<link rel="stylesheet" href="/static/course.css">
<style>
/* ---- Tema Claro (Padrão ou explícito) ---- */
:root,
html[data-theme="light"],
body[data-theme="light"] {
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e0d8;
  --accent:#1f5fd6; --accent-ink:#ffffff; --ok:#17794a; --ok-bg:#e3f4ea;
  --warn:#9a6200; --warn-bg:#fff1d6; --bad:#b42318; --bad-bg:#fde7e5;
  color-scheme: light;
}

/* ---- Modo Escuro Automático via SO (apenas se data-theme NÃO for "light") ---- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) {
    --bg:#14171f; --card:#1c202b; --ink:#e8eaf0; --muted:#98a2b3; --line:#2d3342;
    --accent:#6d9bff; --accent-ink:#0c1530; --ok:#5fd39a; --ok-bg:#16301f;
    --warn:#f5c16c; --warn-bg:#35280f; --bad:#ff8e84; --bad-bg:#3a1a18;
    color-scheme: dark;
  }
}

/* ---- Forçar Modo Escuro explícito ---- */
html[data-theme="dark"],
body[data-theme="dark"] {
  --bg:#14171f; --card:#1c202b; --ink:#e8eaf0; --muted:#98a2b3; --line:#2d3342;
  --accent:#6d9bff; --accent-ink:#0c1530; --ok:#5fd39a; --ok-bg:#16301f;
  --warn:#f5c16c; --warn-bg:#35280f; --bad:#ff8e84; --bad-bg:#3a1a18;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.on{color:var(--ok);border-color:var(--ok)}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px} h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 180px;min-width:0}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button.btn{font:inherit;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
.prompt{font-size:24px;line-height:1.35;margin:10px 0 16px;font-weight:600}
.stage{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.box{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.box.ok{background:var(--ok-bg);color:var(--ok)} .box.bad{background:var(--bad-bg);color:var(--bad)}
.box.warn{background:var(--warn-bg);color:var(--warn)} .box.info{background:var(--bg);border:1px solid var(--line)}
.marks{font-size:18px;line-height:2;margin-top:6px}
.mk{padding:2px 7px;border-radius:6px;margin-right:2px}
.mk.ok{background:var(--ok-bg);color:var(--ok)} .mk.close{background:var(--warn-bg);color:var(--warn)} .mk.wrong{background:var(--bad-bg);color:var(--bad)}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
ul.fix{list-style:none;margin:8px 0 0;padding:0} ul.fix li{padding:10px 0;border-top:1px solid var(--line)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-right:6px;color:var(--muted)}
.old{color:var(--bad);text-decoration:line-through} .new{color:var(--ok);font-weight:600}
.list button.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;font:inherit;color:inherit;cursor:pointer}
.list button.item:first-child{border-top:0}
.list button.item:hover{background:var(--bg)}
.status-solved{color:var(--ok);font-weight:600} .status-pending{color:var(--warn);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px} .stat b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:13px}
/* ---- Seletor de idioma ---- */
.lang-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.lang-btn:hover{background:var(--bg);color:var(--ink)}
.lang-btn[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td input[type=text]{padding:6px 8px;font-size:14px}
.ex{color:var(--muted);font-size:13px}
.big{font-size:34px;font-weight:700;text-align:center;margin:14px 0 4px}
.center{text-align:center}
details summary{cursor:pointer;font-weight:600}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.icon-btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer;line-height:1.3;margin-left:4px;vertical-align:middle}
.icon-btn:hover{background:var(--bg)}
.icon-btn.rec{background:var(--bad-bg);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.subtabs .tab{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.subtabs .tab[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.bubble.other{align-self:flex-start;background:var(--bg)}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bubble .who{font-size:12px;opacity:.75;margin-bottom:2px}
.turn.me{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;gap:6px}
.turn.me .bubble{max-width:100%;align-self:flex-end}
.fb{font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.fb.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.hide-pt .tr{display:none}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw;font-size:14px}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
@media (max-width:560px){ .prompt{font-size:20px} th.hide,td.hide{display:none} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="app-brand">English Trainer</div>
    <nav id="nav">
      <button data-group="today" data-tab="today">Hoje</button>
      <button data-group="course" data-tab="course">Curso</button>
      <button data-group="practice" data-tab="phrases">Praticar</button>
      <button data-group="vocab" data-tab="vocab">Vocabulário</button>
      <button data-group="review" data-tab="review">Revisão</button>
      <button data-group="progress" data-tab="progress">Progresso</button>
      <button data-group="settings" data-tab="settings">Ajustes</button>
    </nav>
    <div id="lang-selector" style="display:flex;gap:4px;align-items:center"></div>
    <button id="theme-btn" type="button" class="btn" style="padding:3px 10px;font-size:13px;border-radius:999px" title="Alternar tema claro/escuro" onclick="Theme.toggle()">🌓 Auto</button>
    <span id="ai" class="pill" title="">IA</span>
  </div>
  <div id="subnav"></div>
</header>
<main id="view"></main>

<script>
"use strict";
// ---------------------------------------------------------------- TEMA CLARO / ESCURO
const Theme = (() => {
  let cur = localStorage.getItem("theme") || "auto";
  function apply(theme) {
    cur = theme;
    localStorage.setItem("theme", theme);
    const doc = document.documentElement;
    const body = document.body;
    if (theme === "dark") {
      doc.setAttribute("data-theme", "dark");
      if (body) body.setAttribute("data-theme", "dark");
    } else if (theme === "light") {
      doc.setAttribute("data-theme", "light");
      if (body) body.setAttribute("data-theme", "light");
    } else {
      doc.removeAttribute("data-theme");
      if (body) body.removeAttribute("data-theme");
    }
    const btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = theme === "dark" ? "🌙 Escuro" : theme === "light" ? "☀️ Claro" : "🌓 Auto";
  }
  function toggle() {
    const isDarkOS = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    let next;
    if (cur === "auto") {
      // Se o SO estiver no tema escuro, alternar vai direto para o claro; se o SO for claro, vai para o escuro
      next = isDarkOS ? "light" : "dark";
    } else if (cur === "light") {
      next = "dark";
    } else if (cur === "dark") {
      next = "auto";
    } else {
      next = "light";
    }
    apply(next);
  }
  apply(cur);
  return { apply, toggle, get: () => cur };
})();

// ---------------------------------------------------------------- SELETOR DE IDIOMA DE ESTUDO
const LangSwitcher = (() => {
  const LANGS = [
    { code: "en", flag: "🇺🇸", name: "English" },
    { code: "de", flag: "🇩🇪", name: "Deutsch" },
  ];
  let cur = localStorage.getItem("study_lang") || "en";

  // atualiza título do app conforme idioma ativo
  function _updateBrand() {
    const el = document.getElementById("app-brand");
    if (!el) return;
    el.textContent = cur === "de" ? "Deutsch Trainer" : "English Trainer";
  }

  async function apply(code) {
    if (!LANGS.some((l) => l.code === code)) code = "en";
    cur = code;
    localStorage.setItem("study_lang", code);
    document.documentElement.lang = code === "de" ? "de-DE" : "pt-BR";
    _updateBrand();
    // atualiza estado visual dos botões
    document.querySelectorAll(".lang-btn").forEach((b) => {
      b.setAttribute("aria-current", b.dataset.lang === code ? "page" : "false");
    });
    // re-renderiza aba atual
    if (typeof go === "function" && typeof currentTab !== "undefined") go(currentTab || "today");
    // persiste no backend sem bloquear a troca da interface
    api("/api/languages/active", { method: "POST", body: { language: code } }).catch(() => {});
  }

  function render() {
    const el = document.getElementById("lang-selector");
    if (!el) return;
    el.replaceChildren(
      ...LANGS.map((l) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lang-btn";
        b.dataset.lang = l.code;
        b.title = l.name;
        b.setAttribute("aria-current", l.code === cur ? "page" : "false");
        b.textContent = l.flag + " " + l.code.toUpperCase();
        b.addEventListener("click", () => apply(l.code));
        return b;
      })
    );
    _updateBrand();
  }

  return { apply, render, syncFromServer: async () => {
    try {
      const data = await api("/api/languages");
      if (data.active) apply(data.active);
    } catch (_) { /* mantém o idioma salvo localmente */ }
  }, get: () => cur };
})();

// ---------------------------------------------------------------- utilidades
const view = document.getElementById("view");

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

// substitui o conteúdo de um elemento ignorando null/false (o replaceChildren nativo escreveria "null")
function put(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json" },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (_) { /* sem corpo */ }
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? "Confira os campos preenchidos." : "Erro " + res.status);
  }
  return data;
}

const STATUS_TIP = { ok: "certa", close: "quase: erro de digitação ou acento", wrong: "errada" };
const KIND = {
  portuguese: "Em português", grammar: "Gramática", spelling: "Ortografia", vocabulary: "Vocabulário",
  missing: "Faltou", extra: "Sobrou", meaning: "Sentido", wrong: "Errado",
};

function marksEl(marks, missing = 0) {
  const out = h("div", {},
    h("div", { class: "marks" }, marks.map((m) => [h("span", { class: "mk " + m.status, title: STATUS_TIP[m.status] }, m.text), " "])),
    h("div", { class: "legend" }, "verde = certa · amarelo = quase (digitação/acento) · vermelho = errada"));
  if (missing > 0) out.append(h("div", { class: "box warn" }, `Faltam ${missing} palavra(s) na sua resposta.`));
  return out;
}

function fixList(items) {
  if (!items || !items.length) return null;
  return h("ul", { class: "fix" }, items.map((c) =>
    h("li", {},
      h("span", { class: "tag" }, KIND[c.kind] || c.kind),
      c.you_wrote ? h("span", { class: "old" }, c.you_wrote) : null,
      c.you_wrote && c.should_be ? " → " : null,
      c.should_be ? h("span", { class: "new" }, c.should_be) : null,
      c.explanation ? h("div", { class: "muted" }, c.explanation) : null)));
}

function errBox(e) { return h("div", { class: "box bad" }, e.message || String(e)); }

// ---------------------------------------------------------------- áudio (voz do próprio navegador)
function toast(msg) {
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 4500);
}

const Voice = (() => {
  const synth = window.speechSynthesis || null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const prefs = { rate: 0.95, voice: "", auto: true, neuralAudio: true };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("voicePrefs") || "{}")); } catch (_) { /* sem armazenamento */ }
  const save = () => { try { localStorage.setItem("voicePrefs", JSON.stringify(prefs)); } catch (_) { /* ignora */ } };

  const englishVoices = () => (synth ? synth.getVoices().filter((v) => /^en/i.test(v.lang)) : []);
  function pick() {
    const list = englishVoices();
    return list.find((v) => v.name === prefs.voice) || list.find((v) => /^en[-_]US/i.test(v.lang)) || list[0] || null;
  }

  let activeAudio = null;

  function fallbackSpeak(text, rate, queue, onEnd) {
    if (!synth || !text) { if (onEnd) onEnd(); return false; }
    if (!queue) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || prefs.rate;
    const v = pick();
    if (v) { u.voice = v; u.lang = v.lang; }
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    synth.speak(u);
    return true;
  }

  // fala em inglês: tenta áudio neural (MP3 limpo) com fallback para o sintetizador do navegador
  function speak(text, { rate, queue, onEnd } = {}) {
    if (!text) return false;
    stop();
    if (prefs.neuralAudio && text.length <= 500) {
      try {
        const audioUrl = `/api/audio/tts?text=${encodeURIComponent(text)}&speed=${rate || prefs.rate}&lang=${LangSwitcher ? LangSwitcher.get() : "en"}`;
        const aud = new Audio(audioUrl);
        aud.playbackRate = rate || prefs.rate;
        activeAudio = aud;
        aud.onended = () => {
          if (activeAudio === aud) activeAudio = null;
          if (onEnd) onEnd();
        };
        aud.onerror = () => {
          if (activeAudio === aud) activeAudio = null;
          fallbackSpeak(text, rate, queue, onEnd);
        };
        aud.play().catch(() => {
          if (activeAudio === aud) activeAudio = null;
          fallbackSpeak(text, rate, queue, onEnd);
        });
        return true;
      } catch (_) {
        return fallbackSpeak(text, rate, queue, onEnd);
      }
    }
    return fallbackSpeak(text, rate, queue, onEnd);
  }

  const stop = () => {
    if (activeAudio) {
      try { activeAudio.pause(); activeAudio.currentTime = 0; } catch (_) {}
      activeAudio = null;
    }
    if (synth) synth.cancel();
  };

  const ERRORS = {
    "not-allowed": "Permita o uso do microfone no navegador (ícone de cadeado ao lado do endereço).",
    "service-not-allowed": "Permita o uso do microfone no navegador.",
    "no-speech": "Não ouvi nada. Tente de novo.",
    "audio-capture": "Nenhum microfone encontrado.",
    network: "O reconhecimento de voz precisa de internet.",
  };
  let rec = null;
  function listen(lang = "en-US") {
    return new Promise((resolve, reject) => {
      if (!SR) { reject(new Error("Este navegador não reconhece fala. Use o Chrome ou o Edge.")); return; }
      if (rec) { try { rec.abort(); } catch (_) { /* já parou */ } }
      const r = new SR();
      rec = r;
      r.lang = lang;
      r.interimResults = false;
      r.maxAlternatives = 1;
      let got = false;
      r.onresult = (ev) => { got = true; resolve(ev.results[0][0].transcript); };
      r.onerror = (ev) => reject(new Error(ERRORS[ev.error] || "Erro no microfone: " + ev.error));
      r.onend = () => { if (rec === r) rec = null; if (!got) reject(new Error("Não ouvi nada. Tente de novo.")); };
      try { r.start(); } catch (e) { reject(e); }
    });
  }
  const stopListening = () => { if (rec) { try { rec.stop(); } catch (_) { /* ignora */ } } };

  return { synth, SR, prefs, save, englishVoices, speak, stop, listen, stopListening };
})();

// botão de ouvir (normal ou devagar); text pode ser uma função para ler o texto na hora do clique
function speakBtn(text, { slow = false } = {}) {
  const get = typeof text === "function" ? text : () => text;
  const label = slow ? "Ouvir devagar" : "Ouvir";
  return h("button", { class: "icon-btn", type: "button", title: label, "aria-label": label,
    onclick: () => { if (!Voice.speak(get(), slow ? { rate: 0.6 } : {})) toast("Sem voz disponível neste navegador. Veja Ajustes → Áudio."); } },
  slow ? "🐢" : "🔊");
}

// botão de falar no microfone; devolve null se o navegador não reconhece fala
function micBtn(onText, lang = "en-US") {
  if (!Voice.SR) return null;
  const b = h("button", { class: "icon-btn", type: "button", title: "Falar no microfone", "aria-label": "Falar no microfone" }, "🎤");
  b.addEventListener("click", async () => {
    if (b.classList.contains("rec")) { Voice.stopListening(); return; }
    b.classList.add("rec");
    try { onText(await Voice.listen(lang)); } catch (e) { toast(e.message); } finally { b.classList.remove("rec"); }
  });
  return b;
}

const state = {
  dialogId: null, textId: null, ai: false, phraseMode: "translate", convTab: "role", roleDialogId: null,
  reviewMode: "meaning", reviewTI: false, vocabFilter: null,
};

// ---------------------------------------------------------------- navegação
const tabs = { phrases: viewPhrases, conversation: viewConversation, texts: viewTexts, vocab: viewVocab, review: viewReview, settings: viewSettings };
// navegação em dois níveis: grupo (barra de cima) e abas do grupo (barra de baixo)
const GROUPS = {
  today: { tabs: [] }, course: { tabs: [], also: ["lesson", "placement"] }, vocab: { tabs: [] }, progress: { tabs: [] }, settings: { tabs: [] },
  practice: { tabs: [["phrases", "Frases"], ["live", "Live Voice Tutor 🎙️"], ["conversation", "Conversação"], ["eargym", "Ear Gym (Escuta)"], ["reading", "Leitura e escuta"], ["pronounce", "Pronúncia"], ["texts", "Meus textos"]] },
  review: { tabs: [["review", "Palavras"], ["grammar", "Gramática"]] },
};
function groupOf(tab) {
  for (const [g, d] of Object.entries(GROUPS)) {
    if (g === tab || d.tabs.some(([t]) => t === tab) || (d.also || []).includes(tab)) return g;
  }
  return tab;
}

let currentTab = null;

async function go(tab) {
  currentTab = tab;
  Voice.stop();
  if (window.LiveVoiceTutor && tab !== "live") {
    try { LiveVoiceTutor.endCall(); } catch (_) {}
  }
  const grp = groupOf(tab);
  document.querySelectorAll("#nav button").forEach((b) => {
    if (b.dataset.group === grp) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const sub = document.getElementById("subnav");
  sub.replaceChildren(...(GROUPS[grp] ? GROUPS[grp].tabs : []).map(([t, label]) =>
    h("button", { type: "button", "data-tab": t, "aria-current": t === tab ? "page" : null, onclick: () => go(t) }, label)));
  put(view, h("p", { class: "muted" }, "Carregando…"));
  try { await tabs[tab](); } catch (e) { put(view, errBox(e)); }
  location.hash = tab;
}
document.getElementById("nav").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-tab]");
  if (b) go(b.dataset.tab);
});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (tabs[t] && t !== currentTab) go(t); });

// ---------------------------------------------------------------- FRASES
function dialogOptions(dialogs, selectedId) {
  const opt = (d) => h("option", { value: d.id, selected: d.id === selectedId }, `${d.title.replace(/^TI — /, "")}${d.level ? " · " + d.level : ""} — ${d.done}/${d.phrase_count}`);
  const it = dialogs.filter((d) => d.title.startsWith("TI — "));
  const other = dialogs.filter((d) => !d.title.startsWith("TI — "));
  return [h("optgroup", { label: "Desenvolvimento de software (TI)" }, it.map(opt)), h("optgroup", { label: "Dia a dia" }, other.map(opt))];
}

async function viewPhrases() {
  const dialogs = await api(`/api/dialogs?lang=${LangSwitcher.get()}`);
  if (state.dialogId !== null && !dialogs.some((d) => d.id === state.dialogId)) state.dialogId = null;

  const st = { phrase: null, stage: 1, pt: "", finished: false, note: "" };
  const card = h("div", { class: "card" });
  const head = h("div", { class: "card" });

  const select = h("select", { "aria-label": "Diálogo" },
    h("option", { value: "" }, "Todos os diálogos (aleatório)"), dialogOptions(dialogs, state.dialogId));
  select.addEventListener("change", () => { state.dialogId = select.value ? Number(select.value) : null; viewPhrases(); });

  const modeSel = h("select", { "aria-label": "Modo de prática" },
    [["translate", "Traduzir: inglês → português → inglês"], ["dictation", "Ditado: ouvir e digitar em inglês"]]
      .map(([v, l]) => h("option", { value: v, selected: state.phraseMode === v }, l)));
  modeSel.addEventListener("change", () => { state.phraseMode = modeSel.value; viewPhrases(); });

  const addBox = h("div", {});
  const addBtn = h("button", { class: "btn", onclick: () => showAdd() }, "+ Adicionar");
  const delBtn = state.dialogId === null ? null : h("button", { class: "btn danger", onclick: async () => {
    if (!confirm("Apagar este diálogo e todas as suas frases?")) return;
    await api(`/api/dialogs/${state.dialogId}`, { method: "DELETE" });
    state.dialogId = null; viewPhrases();
  } }, "Apagar diálogo");
  head.append(h("h2", {}, "Frases e diálogos"),
    h("p", { class: "muted" }, "Veja a frase em inglês e digite em português. Ao acertar, ela inverte e você digita em inglês. No modo Ditado você só ouve."),
    h("div", { class: "row" }, h("div", { class: "grow" }, select), h("div", { class: "grow" }, modeSel), addBtn, delBtn), addBox);

  function showAdd() {
    const en = h("input", { type: "text", placeholder: "Frase em inglês" });
    const pt = h("input", { type: "text", placeholder: "Tradução em português" });
    const title = h("input", { type: "text", placeholder: "Título do diálogo" });
    const lines = h("textarea", { placeholder: "Uma frase por linha, no formato:\nHow are you? | Como você está?\nI'm fine. | Estou bem." });
    const msg = h("div", {});
    put(addBox, h("div", { class: "box info" },
      h("h3", {}, "Frase avulsa"),
      h("div", { class: "row" }, h("div", { class: "grow" }, en), h("div", { class: "grow" }, pt),
        h("button", { class: "btn primary", onclick: async () => {
          try { await api("/api/phrases", { method: "POST", body: { en: en.value, pt: pt.value } }); viewPhrases(); }
          catch (e) { put(msg, errBox(e)); }
        } }, "Salvar")),
      h("h3", { style: "margin-top:16px" }, "Diálogo novo"),
      title, h("div", { style: "height:8px" }), lines,
      h("div", { class: "row end", style: "margin-top:8px" }, h("button", { class: "btn primary", onclick: async () => {
        const parsed = lines.value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
          const [a, ...b] = l.split("|"); return { en: (a || "").trim(), pt: b.join("|").trim() };
        });
        if (parsed.some((p) => !p.en || !p.pt)) { put(msg, errBox(new Error("Cada linha precisa ter: inglês | português"))); return; }
        try { const r = await api("/api/dialogs", { method: "POST", body: { title: title.value, lines: parsed } }); state.dialogId = r.id; viewPhrases(); }
        catch (e) { put(msg, errBox(e)); }
      } }, "Criar diálogo")), msg));
  }

  async function loadNext() {
    const q = new URLSearchParams();
    if (state.dialogId !== null) q.set("dialog_id", state.dialogId);
    if (st.phrase) q.set("exclude", st.phrase.id);
    Object.assign(st, { stage: 1, pt: "", finished: false, note: "" });
    try { st.phrase = await api("/api/practice/next?" + q); } catch (e) { st.phrase = null; put(card, errBox(e)); return; }
    render();
  }

  function render() {
    const p = st.phrase;
    const dict = state.phraseMode === "dictation";
    const direction = dict ? "pt_to_en" : st.stage === 1 ? "en_to_pt" : "pt_to_en";
    const input = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      placeholder: direction === "en_to_pt" ? "Digite em português…" : "Type it in English…", "aria-label": "Sua resposta" });
    const feedback = h("div", {});
    const mic = micBtn((t) => { input.value = t; input.focus(); }, direction === "en_to_pt" ? "pt-BR" : "en-US");

    if (st.finished) {
      put(card,
        h("div", { class: "stage" }, p.dialog_title),
        h("div", { class: "box ok" }, "Frase concluída!"),
        h("p", { class: "prompt" }, p.prompt, " ", speakBtn(p.prompt), speakBtn(p.prompt, { slow: true })),
        h("p", { class: "prompt", style: "font-weight:400" }, st.pt),
        h("div", { class: "row end" }, h("button", { class: "btn primary", id: "next", onclick: loadNext }, "Próxima frase →")));
      document.getElementById("next").focus();
      if (Voice.prefs.auto) Voice.speak(p.prompt);
      return;
    }

    async function submit() {
      if (!input.value.trim()) return;
      try {
        const r = await api(`/api/phrases/${p.id}/check`, { method: "POST", body: { direction, answer: input.value } });
        if (r.correct && r.stage_complete) { st.finished = true; st.pt = r.pt; p.prompt = r.en; render(); return; }
        if (r.correct) { st.stage = 2; st.pt = r.canonical; st.note = "Certo! Agora o inverso: escreva a mesma frase em inglês."; render(); return; }
        put(feedback,
          marksEl(r.marks, r.missing),
          r.format_issue ? h("div", { class: "box warn" }, "As palavras estão certas, mas confira maiúsculas, pontuação e espaços.") : null);
        input.focus();
      } catch (e) { put(feedback, errBox(e)); }
    }

    async function reveal() {
      try {
        const r = await api(`/api/phrases/${p.id}/reveal`, { method: "POST", body: { direction } });
        put(feedback, h("div", { class: "box info" }, "Resposta: ", h("b", {}, r.answer), " ", direction === "pt_to_en" ? speakBtn(r.answer) : null,
          h("div", { class: "muted" }, "Digite-a acima para continuar.")));
        input.focus();
      } catch (e) { put(feedback, errBox(e)); }
    }

    input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });
    let promptEl;
    if (dict) {
      promptEl = h("div", {},
        h("p", { class: "prompt", id: "prompt" }, "🎧 Ouça e digite em inglês o que você ouviu"),
        h("div", { class: "row", style: "margin-bottom:12px" }, speakBtn(p.prompt), speakBtn(p.prompt, { slow: true }),
          Voice.synth ? null : h("span", { class: "muted" }, "Sem voz neste navegador: veja Ajustes → Áudio.")));
    } else {
      const showEn = st.stage === 1;
      promptEl = h("p", { class: "prompt", id: "prompt" }, showEn ? p.prompt : st.pt,
        showEn ? [" ", speakBtn(p.prompt), speakBtn(p.prompt, { slow: true })] : null);
    }
    put(card,
      h("div", { class: "stage" }, `${p.dialog_title}${p.speaker ? " · " + p.speaker : ""} — ${dict ? "ditado" : `passo ${st.stage} de 2: ${st.stage === 1 ? "inglês → português" : "português → inglês"}`}`),
      st.note ? h("div", { class: "box ok" }, st.note) : null,
      promptEl,
      h("div", { class: "row" }, h("div", { class: "grow" }, input), mic,
        h("button", { class: "btn primary", id: "check", onclick: submit }, "Verificar"),
        h("button", { class: "btn", onclick: reveal }, "Mostrar resposta")),
      feedback);
    input.focus();
    // fala a frase em inglês ao aparecer (ditado e passo 1); desligue em Ajustes → Áudio
    if (Voice.prefs.auto && (dict || st.stage === 1)) Voice.speak(p.prompt);
  }

  put(view, head, card);
  await loadNext();
}

async function viewConversation() {
  const body = h("div", {});
  const defs = [
    ["role", "Interpretar um diálogo"],
    ["ai", "Conversar com a IA"],
    ["custom", "✨ Criar Diálogo sob Demanda"],
    ["live_redirect", "🎙️ Tutor Ao Vivo (Realtime)"]
  ];
  const buttons = defs.map(([id, label]) => h("button", { class: "tab", "data-sub": id, onclick: () => choose(id) }, label));
  function choose(id) {
    if (id === "live_redirect") {
      go("live");
      return;
    }
    state.convTab = id;
    buttons.forEach((b) => b.toggleAttribute("aria-current", b.dataset.sub === id));
    (id === "role" ? roleplayView : id === "ai" ? chatView : customDialogView)(body).catch((e) => put(body, errBox(e)));
  }
  put(view, h("div", { class: "card" },
    h("h2", {}, "Conversação"),
    h("p", { class: "muted" }, "Pratique responder como numa conversa de verdade: ouvindo, falando ou digitando."),
    h("div", { class: "subtabs" }, buttons)), body);
  choose(state.convTab || "role");
}

// ---- interpretar um diálogo: os outros personagens falam, você responde em inglês
async function roleplayView(body) {
  const dialogs = (await api(`/api/dialogs?lang=${LangSwitcher.get()}`)).filter((d) => d.speakers >= 2);
  const sel = h("select", { "aria-label": "Diálogo" }, dialogOptions(dialogs, state.roleDialogId));
  const roles = h("div", { class: "row" });
  const start = h("button", { class: "btn primary" }, "Começar");

  async function loadRoles() {
    const r = await api(`/api/roleplay/${sel.value}`);
    state.roleDialogId = Number(sel.value);
    put(roles, h("span", { class: "muted" }, "Você é:"), r.speakers.map((sp, i) =>
      h("label", { class: "chk" }, h("input", { type: "radio", name: "role", value: sp, checked: i === Math.min(1, r.speakers.length - 1) }), sp)));
  }
  sel.addEventListener("change", () => loadRoles().catch((e) => put(roles, errBox(e))));
  start.addEventListener("click", () => {
    const chosen = roles.querySelector("input[name=role]:checked");
    if (chosen) run(Number(sel.value), chosen.value);
  });

  put(body, h("div", { class: "card" },
    h("p", { class: "muted" }, "Escolha um diálogo e seu personagem. As falas dos outros são faladas em inglês; nas suas, você vê a dica em português e responde em inglês (digitando ou falando)."),
    h("div", { class: "row" }, h("div", { class: "grow" }, sel)), roles,
    h("div", { class: "row end", style: "margin-top:8px" }, start)));
  await loadRoles();

  async function run(dialogId, role) {
    const data = await api(`/api/roleplay/${dialogId}?role=${encodeURIComponent(role)}`);
    const chat = h("div", { class: "chat" });
    const panel = h("div", { class: "card" });
    const trChk = h("input", { type: "checkbox", checked: true });
    trChk.addEventListener("change", () => chat.classList.toggle("hide-pt", !trChk.checked));
    let i = 0, mistakes = 0;

    const bubble = (line, text, mine) => h("div", { class: "bubble " + (mine ? "me" : "other") },
      h("div", { class: "who" }, line.speaker || ""),
      h("div", {}, text, " ", mine ? null : [speakBtn(text), speakBtn(text, { slow: true })]),
      mine ? null : h("div", { class: "muted tr" }, line.pt));

    function next() {
      while (i < data.lines.length && !data.lines[i].mine) {
        const l = data.lines[i++];
        chat.append(bubble(l, l.en, false));
        if (Voice.prefs.auto) Voice.speak(l.en, { queue: true });
      }
      if (i >= data.lines.length) { finish(); return; }
      ask(data.lines[i]);
      if (chat.lastChild) chat.lastChild.scrollIntoView({ block: "nearest" });
    }

    function ask(line) {
      const input = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
        placeholder: "Responda em inglês…", "aria-label": "Sua resposta em inglês" });
      const feedback = h("div", {});
      const mic = micBtn((t) => { input.value = t; input.focus(); }, "en-US");
      async function submit() {
        if (!input.value.trim()) return;
        try {
          const r = await api(`/api/phrases/${line.id}/check`, { method: "POST", body: { direction: "pt_to_en", answer: input.value } });
          if (r.correct) {
            chat.append(bubble(line, r.canonical, true));
            if (Voice.prefs.auto) Voice.speak(r.canonical, { queue: true });
            i++; next(); return;
          }
          mistakes++;
          put(feedback, marksEl(r.marks, r.missing));
          input.focus();
        } catch (e) { put(feedback, errBox(e)); }
      }
      async function reveal() {
        try {
          const r = await api(`/api/phrases/${line.id}/reveal`, { method: "POST", body: { direction: "pt_to_en" } });
          mistakes++;
          put(feedback, h("div", { class: "box info" }, "Resposta: ", h("b", {}, r.answer), " ", speakBtn(r.answer), h("div", { class: "muted" }, "Digite-a acima para continuar.")));
        } catch (e) { put(feedback, errBox(e)); }
      }
      input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });
      put(panel,
        h("div", { class: "stage" }, `Sua vez (${role})`),
        h("div", { class: "box info", id: "hint" }, "Diga em inglês: ", h("b", {}, "“" + line.pt + "”")),
        h("div", { class: "row", style: "margin-top:10px" }, h("div", { class: "grow" }, input), mic,
          h("button", { class: "btn primary", id: "check", onclick: submit }, "Verificar"),
          h("button", { class: "btn", onclick: reveal }, "Mostrar resposta")),
        feedback);
      input.focus();
    }

    function finish() {
      put(panel, h("div", { class: "box ok", id: "finished" }, h("b", {}, "Diálogo concluído! "),
        mistakes ? `${mistakes} tentativa(s) errada(s) ou resposta(s) mostrada(s).` : "Sem nenhum erro. Excelente!"),
        h("div", { class: "row end", style: "margin-top:10px" },
          h("button", { class: "btn", onclick: () => roleplayView(body) }, "Escolher outro"),
          h("button", { class: "btn primary", onclick: () => run(dialogId, role) }, "Repetir")));
    }

    put(body, h("div", { class: "card" },
      h("div", { class: "row" }, h("h3", { class: "grow", style: "margin:0" }, data.title),
        h("label", { class: "chk" }, trChk, "Mostrar tradução das falas"),
        h("button", { class: "btn", onclick: () => { Voice.stop(); roleplayView(body); } }, "Sair")),
      chat), panel);
    next();
  }
}

async function chatView(body) {

    put(body, h("div", { class: "card" }, h("h3", {}, "Conversa livre com a IA"),

      h("p", { class: "muted" }, "Enquanto isso, use “Interpretar um diálogo”: funciona sem IA e inclui cenários de TI (daily, code review, incidente, entrevista).")));
    return;

  const scenario = h("select", { "aria-label": "Cenário" }, info.scenarios.map((s) => h("option", { value: s.id }, s.title)));

  scenario.addEventListener("change", showAbout);
  showAbout();
  put(body, h("div", { class: "card" },
    h("p", { class: "muted" }, "A IA interpreta um colega de trabalho, responde em inglês e corrige cada mensagem sua. Pode misturar português onde não souber."),
    h("div", { class: "row" }, h("div", { class: "grow" }, scenario), h("div", { class: "grow" }, level)), about,
    h("div", { class: "row end" }, h("button", { class: "btn primary", id: "startchat", onclick: () => runChat(info.scenarios.find((s) => s.id === scenario.value), level.value) }, "Começar a conversa"))));

  function runChat(sc, lvl) {
    const history = [];
    let learned = 0, busy = false;
    let promptTime = Date.now();
    const log = h("div", { class: "chat" });
    const counter = h("div", { class: "muted" });
    const input = h("input", { type: "text", autocomplete: "off", spellcheck: "false", placeholder: "Write your answer in English…", "aria-label": "Sua mensagem" });
    const sendBtn = h("button", { class: "btn primary", id: "send" }, "Enviar");
    const mic = micBtn((t) => { input.value = t; input.focus(); }, "en-US");
    const continuousChk = h("input", { type: "checkbox" });
    const continuousLabel = h("label", { class: "chk", style: "font-size:13px" }, continuousChk, h("span", {}, h("b", {}, "🎙️ Modo Conversa Contínua (Hands-Free)"), h("small", { class: "muted", style: "display:block" }, "Abre o microfone automaticamente após a resposta da IA.")));

    function partnerBubble(r) {
      const tr = h("div", { class: "muted tr", style: "display:none" }, r.reply_pt);
      return h("div", { class: "bubble other" }, h("div", { class: "who" }, sc.title),
        h("div", {}, r.reply, " ", speakBtn(r.reply), speakBtn(r.reply, { slow: true })),
        r.reply_pt ? [h("button", { class: "linkbtn", type: "button", onclick: (ev) => { tr.style.display = tr.style.display === "none" ? "block" : "none"; ev.target.textContent = tr.style.display === "none" ? "ver tradução" : "ocultar tradução"; } }, "ver tradução"), tr] : null);
    }
    function correctionBlock(c, fluency) {

        return h("div", {}, parts);
      }

        c.corrected ? h("div", {}, h("span", { class: "tag" }, "Melhor assim"), h("b", {}, c.corrected), " ", speakBtn(c.corrected)) : null,
        c.summary ? h("div", { class: "muted" }, c.summary) : null, fixList(c.items)));
      return h("div", {}, parts);
    }

    async function triggerContinuousListen() {
      if (!continuousChk.checked || busy) return;
      promptTime = Date.now();
      try {
        input.placeholder = "🎤 Ouvindo sua resposta… Fale agora!";
        const spoken = await Voice.listen("en-US");
        input.value = spoken;
        input.placeholder = "Write your answer in English…";
        send();
      } catch (e) {
        input.placeholder = "Write your answer in English…";
      }
    }

    async function turn(message, responseTime) {
      if (busy) return;
      busy = true; sendBtn.disabled = true;
      const mine = message ? h("div", { class: "turn me" }, h("div", { class: "bubble me" }, h("div", { class: "who" }, "Você"), h("div", {}, message))) : null;
      if (mine) log.append(mine);
      const thinking = h("div", { class: "bubble other muted" }, "…");
      log.append(thinking);
      try {
        const r = await api("/api/conversation/turn", { method: "POST", body: {
          scenario_id: sc.id,
          level: lvl,
          history: history.slice(-30),
          message,
          response_time_seconds: responseTime || null
        } });
        thinking.remove();
        if (message) { history.push({ role: "learner", text: message }); mine.append(correctionBlock(r.correction, r.fluency)); }
        history.push({ role: "partner", text: r.reply });
        log.append(partnerBubble(r));
        promptTime = Date.now();
        if (Voice.prefs.auto) {
          Voice.speak(r.reply, { onEnd: () => { promptTime = Date.now(); triggerContinuousListen(); } });
        } else if (continuousChk.checked) {
          triggerContinuousListen();
        }
        learned += r.learned || 0;
        counter.textContent = learned ? `${learned} palavra(s) desta conversa foram para a revisão.` : "";
        if (log.lastChild) log.lastChild.scrollIntoView({ block: "nearest" });
      } catch (e) {
        thinking.remove(); if (mine) mine.remove();
        input.value = message;
        log.append(errBox(e));
      }
      busy = false; sendBtn.disabled = false; input.focus();
    }
    function send() {
      const m = input.value.trim();
      if (!m) return;
      const diffSec = promptTime ? (Date.now() - promptTime) / 1000 : null;
      input.value = "";
      turn(m, diffSec);
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") send(); });

        put(coachContainer, h("div", { class: "coach-modal" },

          upgrades.length ? h("div", {}, h("h4", { style: "margin:10px 0 4px" }, "💎 Como soar mais sênior e natural:"), h("ul", { style: "padding-left:16px" }, upgrades)) : null,
          star.example_speech ? h("div", { style: "margin-top:12px" },

            h("div", { class: "star-step" }, h("b", {}, "Situação: "), star.situation),

async function viewReview() {
  const modes = [["meaning", "Ver a palavra → digitar o significado"], ["reverse", "Ver o significado → escrever a palavra"], ["listen", "Ouvir → digitar a palavra"]];
  const modeSel = h("select", { "aria-label": "Modo da revisão" }, modes.map(([v, l]) => h("option", { value: v, selected: v === state.reviewMode }, l)));
  const tiChk = h("input", { type: "checkbox", checked: state.reviewTI });
  const card = h("div", { class: "card" });
  modeSel.addEventListener("change", () => { state.reviewMode = modeSel.value; next(); });
  tiChk.addEventListener("change", () => { state.reviewTI = tiChk.checked; next(); });
  put(view, h("div", { class: "card" }, h("div", { class: "row" }, h("div", { class: "grow" }, modeSel),
    h("label", { class: "chk" }, tiChk, "Só vocabulário de TI"))), card);

  let seq = 0;  // mudar o modo/filtro rápido dispara várias buscas: só a última pode desenhar a tela
  async function next() {
    const mode = state.reviewMode;
    const mine = ++seq;
    const r = await api(`/api/review/next?mode=${mode}${state.reviewTI ? "&tag=ti" : ""}&lang=${LangSwitcher.get()}`);
    if (mine !== seq) return;
    if (r.done) {
      put(card, h("h2", {}, "Revisão"), h("div", { class: "box ok" }, "Nada para revisar agora neste modo. Bom trabalho!"),
        r.next_due ? h("p", { class: "muted" }, "Próxima palavra volta em " + new Date(r.next_due).toLocaleString("pt-BR") + ".") : null,
        r.pending_meanings && mode !== "listen" ? h("div", { class: "box info" }, `${r.pending_meanings} palavra(s) ainda não têm significado e ficam fora deste modo. `,
          h("button", { class: "btn", onclick: () => { state.vocabFilter = "no_meaning"; go("vocab"); } }, "Preencher agora")) : null,
        r.pending_meanings && mode !== "listen" ? h("p", { class: "muted" }, "Dica: o modo “Ouvir → digitar” funciona mesmo sem significado.") : null);
      return;
    }
    const w = r.word;
    const input = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Sua resposta",
      placeholder: mode === "meaning" ? "Significado em português…" : "Digite a palavra em inglês…" });
    const out = h("div", {});
    const mic = micBtn((t) => { input.value = t; input.focus(); }, mode === "meaning" ? "pt-BR" : "en-US");

    async function submit() {
      if (!input.value.trim()) return;
      input.disabled = true; btn.disabled = true;
      try {
        const a = await api(`/api/review/${w.id}/answer`, { method: "POST", body: { answer: input.value, mode } });
        put(out, h("div", { class: "box " + (a.correct ? "ok" : "bad") }, a.correct ? "Certo! " : "Não foi dessa vez. ", h("b", {}, a.word), " ", speakBtn(a.word),
          a.meaning_pt ? [" = ", a.meaning_pt] : null,
          a.example ? h("div", { class: "ex" }, a.example, " ", speakBtn(a.example)) : null),
          h("div", { class: "row end", style: "margin-top:10px" }, h("button", { class: "btn primary", id: "nx", onclick: next }, "Próxima →")));
        document.getElementById("nx").focus();
      } catch (e) { put(out, errBox(e)); input.disabled = false; btn.disabled = false; }
    }
    const btn = h("button", { class: "btn primary", id: "check", onclick: submit }, "Verificar");
    input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

    let front;
    if (mode === "meaning") {
      front = [h("div", { class: "big", id: "front" }, w.word), h("div", { class: "row", style: "justify-content:center" }, speakBtn(w.word), speakBtn(w.word, { slow: true })),
        w.example ? h("p", { class: "center muted" }, "“" + w.example + "” ", speakBtn(w.example)) : null];
    } else if (mode === "reverse") {
      front = [h("div", { class: "center muted" }, "Como se diz em inglês?"), h("div", { class: "big", id: "front" }, w.meaning_pt)];
    } else {
      front = [h("div", { class: "center muted" }, "Ouça e digite a palavra em inglês"),
        h("div", { class: "row", style: "justify-content:center;margin:12px 0" }, speakBtn(w.word), speakBtn(w.word, { slow: true }), h("span", { id: "front" }))];
    }
    put(card, h("div", { class: "stage" }, `Revisão — ${r.remaining} restante(s)${w.tag === "ti" ? " · TI" : ""}`), front,
      h("div", { class: "row" }, h("div", { class: "grow" }, input), mic, btn), out);
    input.focus();
    if (Voice.prefs.auto && mode !== "reverse") Voice.speak(w.word);
  }
  await next();
}

  const testBtn = h("button", { class: "btn", type: "button" }, "⚡ Testar Conexão");
  const statusMsg = h("div", { style: "margin-top:10px" });

  const keyRow = h("div", { class: "row", style: "margin-top:8px" }, h("span", { style: "width:110px" }, "Chave de API"), h("div", { class: "grow" }, keyInput));
  const modelRow = h("div", { class: "row", style: "margin-top:8px" }, h("span", { style: "width:110px" }, "Modelo"), h("div", { class: "grow" }, modelInput), detectBtn);
  const endpointRow = h("div", { class: "row", style: "margin-top:8px" }, h("span", { style: "width:110px" }, "Endereço"), h("div", { class: "grow" }, endpointInput));
  const helperText = h("p", { class: "muted", style: "font-size:13px;margin:8px 0" });

  function updateFields() {
    const p = provSel.value;
    detectBtn.style.display = "none";
    keyRow.style.display = (p === "gemini" || p === "anthropic" || p === "openai") ? "flex" : "none";
    endpointRow.style.display = (p === "ollama" || p === "lmstudio" || p === "openai") ? "flex" : "none";
    modelRow.style.display = (p !== "none") ? "flex" : "none";

    if (p === "gemini") {
      helperText.innerHTML = "O Google Gemini possui um nível gratuito bem generoso. Você pode obter sua chave no <a href='https://aistudio.google.com/app/apikey' target='_blank' style='color:var(--accent);text-decoration:underline'>Google AI Studio</a> em 1 minuto.";
      if (!modelInput.value || modelInput.value === "local-model" || modelInput.value.includes("llama")) modelInput.value = "gemini-2.5-flash";
    } else if (p === "ollama") {
      helperText.textContent = "Rode 'ollama serve' no seu terminal. O Ollama funciona 100% offline no seu computador sem gastar internet.";
      detectBtn.style.display = "inline-block";
      if (!endpointInput.value) endpointInput.value = "http://localhost:11434";
      if (!modelInput.value || modelInput.value.includes("gemini")) modelInput.value = "llama3.2";
    } else if (p === "lmstudio") {
      helperText.textContent = "Abra o aplicativo LM Studio no seu PC e inicie o Local Server (na aba com ícone de terminal do LM Studio).";
      detectBtn.style.display = "inline-block";
      if (!endpointInput.value) endpointInput.value = "http://localhost:1234/v1";
      if (!modelInput.value || modelInput.value.includes("gemini")) modelInput.value = "local-model";
    } else if (p === "anthropic") {
      helperText.textContent = "Usa os modelos Claude (ex: claude-sonnet-5-5) da Anthropic API.";
      if (!modelInput.value || modelInput.value.includes("gemini")) modelInput.value = "claude-sonnet-5-5";
    } else if (p === "openai") {
      helperText.textContent = "Usa a API da OpenAI (ex: gpt-4o-mini) ou qualquer endpoint compatível.";
      if (!endpointInput.value) endpointInput.value = "https://api.openai.com/v1";
      if (!modelInput.value || modelInput.value.includes("gemini")) modelInput.value = "gpt-4o-mini";
    } else {
      helperText.textContent = "Modo sem IA ativo. Os textos são corrigidos apenas contra a referência exata.";
    }
  }

  detectBtn.addEventListener("click", async () => {
    const p = provSel.value;
    detectBtn.disabled = true;
    put(statusMsg, h("p", { class: "muted" }, "Buscando modelos locais…"));
    try {
      const url = p === "ollama" ? `/api/ai/ollama/models?host=${encodeURIComponent(endpointInput.value)}` : `/api/ai/lmstudio/models?host=${encodeURIComponent(endpointInput.value)}`;
      const res = await api(url);
      if (res.ok && res.models && res.models.length) {
        put(statusMsg, h("div", { class: "box ok" }, `Encontrado(s) ${res.models.length} modelo(s): ${res.models.join(", ")}`));
        modelInput.value = res.models[0];
      } else {
        put(statusMsg, h("div", { class: "box warn" }, res.error || "Nenhum modelo encontrado. Verifique se o servidor local está ativo."));
      }
    } catch (e) {
      put(statusMsg, errBox(e));
    } finally {
      detectBtn.disabled = false;
    }
  });

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    put(statusMsg, h("p", { class: "muted" }, "Salvando configuração de IA…"));
    try {
      const res = await api("/api/ai/config", {
        method: "POST",
        body: {
          provider: provSel.value,
          api_key: keyInput.value,
          model: modelInput.value,
          endpoint: endpointInput.value
        }
      });
      put(statusMsg, h("div", { class: "box ok" }, "✓ " + res.message));
      toast(res.message);
      updateAIPill(res.ai_enabled, res.provider, res.model);
    } catch (e) {
      put(statusMsg, errBox(e));
    } finally {
      saveBtn.disabled = false;
    }
  });

  testBtn.addEventListener("click", async () => {
    testBtn.disabled = true;
    put(statusMsg, h("p", { class: "muted" }, "Testando resposta da IA…"));
    try {
      const res = await api("/api/ai/test", { method: "POST" });
      put(statusMsg, h("div", { class: "box ok" }, `⚡ ${res.message}`));
    } catch (e) {
      put(statusMsg, errBox(e));
    } finally {
      testBtn.disabled = false;
    }
  });

  provSel.addEventListener("change", updateFields);
  updateFields();

  put(card,
    h("div", { class: "row" },
      h("h3", { style: "margin:0" }, "Inteligência Artificial"),
      h("div", { class: "grow" }),
      h("span", { class: cfg.ai_enabled ? "ai-badge-active" : "muted", style: "font-size:13px" },
        cfg.ai_enabled ? `Ativa (${(cfg.provider || "").toUpperCase()})` : "Desligada")),
    h("p", { class: "muted" }, "Acelere sua fluência praticando conversação livre em inglês para cenários reais de TI (Daily, Code Review, Incidentes e Entrevistas Técnicas) e recebendo correções em tempo real."),
    h("div", { class: "row", style: "margin-top:10px" }, h("span", { style: "width:110px" }, "Provedor"), h("div", { class: "grow" }, provSel)),
    keyRow, endpointRow, modelRow, helperText,
    h("div", { class: "row", style: "margin-top:14px;gap:8px" }, saveBtn, testBtn),
    statusMsg);

  return card;
}

// ---------------------------------------------------------------- AJUSTES
async function viewSettings() {
  const s = await api("/api/settings");
  const acc = h("input", { type: "checkbox", checked: s.ignore_accents });
  const strict = h("input", { type: "checkbox", checked: s.strict_exact });
  const save = () => api("/api/settings", { method: "PUT", body: { ignore_accents: acc.checked, strict_exact: strict.checked } }).catch((e) => alert(e.message));
  acc.addEventListener("change", save); strict.addEventListener("change", save);

  const audio = h("div", { class: "card", id: "audio" });
  function renderAudio() {
    const voices = Voice.englishVoices();
    const voiceSel = h("select", { "aria-label": "Voz" }, h("option", { value: "" }, "Automática"),
      voices.map((v) => h("option", { value: v.name, selected: v.name === Voice.prefs.voice }, `${v.name} (${v.lang})`)));
    voiceSel.addEventListener("change", () => { Voice.prefs.voice = voiceSel.value; Voice.save(); });
    const rate = h("input", { type: "range", min: "0.5", max: "1.3", step: "0.05", value: String(Voice.prefs.rate), "aria-label": "Velocidade da voz" });
    const rateLabel = h("span", { class: "muted" }, Voice.prefs.rate.toFixed(2) + "×");
    rate.addEventListener("input", () => { Voice.prefs.rate = Number(rate.value); rateLabel.textContent = Voice.prefs.rate.toFixed(2) + "×"; Voice.save(); });
    const auto = h("input", { type: "checkbox", checked: Voice.prefs.auto });
    auto.addEventListener("change", () => { Voice.prefs.auto = auto.checked; Voice.save(); });
    put(audio, h("h3", {}, "Áudio"),
      h("p", { class: "muted" }, "Voz: ", Voice.synth ? (voices.length ? `${voices.length} voz(es) em inglês encontrada(s).` : "nenhuma voz em inglês encontrada.") : "este navegador não tem síntese de voz.",
        " Microfone: ", Voice.SR ? "disponível (Chrome/Edge; usa a internet)." : "indisponível neste navegador (use Chrome ou Edge)."),
      Voice.synth && !voices.length ? h("div", { class: "box warn" },
        "Sem voz em inglês, o app fica mudo. No Linux, o navegador precisa de uma voz do sistema: instale com ",
        h("code", {}, "sudo apt install speech-dispatcher espeak-ng"), " e reinicie o navegador. No Windows e no macOS as vozes já vêm instaladas.") : null,
      h("div", { class: "row" }, h("div", { class: "grow" }, voiceSel)),
      h("div", { class: "row", style: "margin-top:8px" }, h("span", {}, "Velocidade"), h("div", { class: "grow" }, rate), rateLabel),
      h("label", { class: "chk" }, auto, h("span", {}, h("b", {}, "Falar automaticamente"), h("div", { class: "muted" }, "Fala a frase em inglês ao aparecer (frases, ditado, conversação e revisão)."))),
      h("div", { class: "row" }, h("button", { class: "btn", id: "testvoice", onclick: () => { if (!Voice.speak("Hello! This is a test of the English voice.")) toast("Sem voz disponível neste navegador."); } }, "🔊 Testar voz")));
  }
  renderAudio();
  if (Voice.synth) Voice.synth.onvoiceschanged = () => { if (currentTab === "settings") renderAudio(); };

  put(view, h("div", { class: "card" }, h("h2", {}, "Ajustes"),
    h("label", { class: "chk" }, acc, h("span", {}, h("b", {}, "Ignorar acentos"), h("div", { class: "muted" }, "Aceita “voce” no lugar de “você”. Por padrão, o acento precisa estar correto."))),
    h("label", { class: "chk" }, strict, h("span", {}, h("b", {}, "Modo exato"), h("div", { class: "muted" }, "Maiúsculas, pontuação e espaços também precisam ser idênticos. Por padrão são ignorados."))),
    h("p", { class: "muted" }, "Sempre valem: contrações em inglês (I'm = I am) e traduções alternativas cadastradas.")),
    await planSettingsCard(),
    await aiSettingsCard(),
    audio);
}

function updateAIPill(enabled, provider, model) {
  state.ai = enabled;
  const pill = document.getElementById("ai");
  if (!pill) return;
  pill.textContent = enabled ? `IA ativa (${provider || "on"})` : "IA desligada";
  pill.classList.toggle("on", enabled);
  pill.title = enabled ? `Provedor: ${provider} · Modelo: ${model}` : "Clique em Ajustes para configurar";
}

// ---------------------------------------------------------------- início
async function init() {
  LangSwitcher.render();
  try {
    const s = await api("/api/status");
    updateAIPill(s.ai_enabled, s.provider, s.model);
  } catch (_) { /* a página segue funcionando */ }
  // o banco é a fonte definitiva: evita sobrescrever a escolha alemã pelo localStorage antigo
  await LangSwitcher.syncFromServer();
  const start = location.hash.slice(1);
  go(tabs[start] ? start : "today");
}
window.addEventListener("load", init);
</script>

Object.assign(tabs, { today: viewToday, course: viewCourse, lesson: viewLesson, placement: viewPlacement, grammar: viewGrammar, progress: viewProgress, reading: viewReading, pronounce: viewPronounce, eargym: viewEarGym, live: viewLiveConversation });
</script>
